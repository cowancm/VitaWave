<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vis-Graph3d Real-time Renderer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #controls {
            padding: 10px;
            height: 50px;
            box-sizing: border-box;
        }
        #visualization {
            width: 100%;
            height: calc(100% - 50px);
            border: none;
        }
        #visualization canvas {
            font-size: 18px !important;
        }
        button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="generateBtn">Generate 50 Random Points</button>
    </div>
    <div id="visualization"></div>

    <script src="./node_modules/vis-graph3d/dist/vis-graph3d.min.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
